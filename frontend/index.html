<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16302B" />

    <!-- Іконка вкладки браузера: SVG для сучасних браузерів, PNG-фолбек
         для тих, що SVG-фавікони ще не вміють. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <!-- Іконка, якщо додати сайт на головний екран iPhone/iPad. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Маніфест: щоб на Android теж можна було "Додати на головний
         екран" з нормальною іконкою й назвою, а не значком браузера. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Еліас — гра для компанії онлайн</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
